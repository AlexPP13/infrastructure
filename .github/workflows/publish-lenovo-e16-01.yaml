name: Publish lenovo-e16-01 image

on:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [main]
    paths:
      - lenovo-e16-01/**
      - .github/workflows/publish-lenovo-e16-01.yaml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-lenovo-e16-01-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/lenovo-e16-01
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: ./lenovo-e16-01/filesystem
          file: ./lenovo-e16-01/Containerfile
          pull: true
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=lenovo-e16-01
          cache-to: type=gha,mode=max,scope=lenovo-e16-01
